<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilometrika · 운동 기록</title>
<script src="/static/vendor/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/vendor/leaflet.min.css">
<script src="/static/vendor/leaflet.min.js"></script>
<style>
  :root {
    --bg: #101418;
    --panel: #171d24;
    --line: #242d37;
    --text: #d7dee6;
    --dim: #7d8b99;
    --hr: #e05c5c;       /* пульс */
    --speed: #58a6ff;    /* скорость */
    --elev: #4d5a48;     /* рельеф */
    --accent: #7ee08a;   /* итоги */
    --run: #7ee08a;      /* бег */
    --bike: #58a6ff;     /* велосипед */
    --other: #c9a15a;    /* прочие виды спорта */
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    padding: 24px; max-width: 1200px; margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap:wrap; gap:8px 16px; }

  .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
  .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; }
  .grid > div, .panel { min-width: 0; }
  .panel > div[style*="display:flex"] { flex-wrap: wrap; gap: 10px; }
  .seg { flex-shrink: 0; }
  .seg button, button.del { min-height: 36px; white-space: nowrap; }
  .act > div { min-width: 0; overflow-wrap: anywhere; }
  .act .dist { flex-shrink: 0; white-space: nowrap; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    .grid .panel { padding: 12px; }
    #detailTitle { line-height: 1.7; }
    .stats .stat b { font-size: 18px; overflow-wrap: anywhere; }
  }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel h2 { font-size: 12px; text-transform: none; letter-spacing: .12em; color: var(--dim); margin-bottom: 12px; }

  #drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px;
    text-align: center; color: var(--dim); cursor: pointer; margin-bottom: 16px;
    transition: border-color .15s, color .15s;
  }
  #drop.hover, #drop:hover { border-color: var(--accent); color: var(--accent); }

  .split {
    display: grid; grid-template-columns: 32px 62px minmax(0, 1fr) 66px;
    gap: 10px; align-items: center; padding: 3px 0; font-size: 13px;
  }
  .split .bar { height: 12px; border-radius: 6px; background: var(--sport-c, var(--accent)); }
  .split .elev { color: var(--dim); text-align: right; }
  .split.head { color: var(--dim); font-size: 11px; text-transform: none; letter-spacing: .08em; }
  .yhead {
    display: flex; align-items: center; gap: 8px; padding: 8px;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--line);
  }
  .yhead:hover { background: rgba(255,255,255,.03); }
  .yhead .chev { color: var(--dim); font-size: 11px; width: 12px; }
  .yhead .ysum { margin-left: auto; color: var(--dim); font-size: 12px; }
  .ybody .act { padding-left: 26px; }
  .act {
    padding: 10px 8px; border-bottom: 1px solid var(--line);
    cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
    border-left: 2px solid transparent;
  }
  .act:hover { background: rgba(255,255,255,.03); }
  .act.sel { border-left-color: var(--sport-c, var(--accent)); background: rgba(255,255,255,.05); }
  .act .sport { color: var(--dim); font-size: 12px; }
  .act .sport::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px; vertical-align: baseline;
    background: var(--sport-c, var(--other));
  }
  .act .dist { color: var(--sport-c, var(--accent)); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: none; letter-spacing: .08em; }
  .stat.hr b { color: var(--hr); } .stat.spd b { color: var(--speed); } .stat.dst b { color: var(--accent); }

  canvas { max-height: 320px; max-width: 100%; }

  .muted { color: var(--dim); }
  .uprog { font-size: 12px; color: var(--dim); margin: 8px 0 4px; }
  .uprog.err { color: var(--hr); white-space: normal; word-break: break-word; }
  .uprog .bar { height: 4px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .uprog .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  .uprog.err .bar { display: none; }
  button.del {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  button.del:hover { border-color: var(--hr); color: var(--hr); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: none; border: none; color: var(--dim); padding: 4px 12px;
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: rgba(126,224,138,.12); color: var(--text); }
  #map {
    height: 300px; border-radius: 6px; margin-bottom: 16px;
    border: 1px solid var(--line); background: var(--bg);
  }
  .leaflet-container { font: inherit; }
  /* Map study C: filter only raster tiles, not routes, markers or credits. */
  #map .leaflet-tile-pane { filter: saturate(0.05) brightness(1.14) contrast(0.82); }
  #map .study-pin { display:block; width:24px; height:24px; padding:0; border:0; background:transparent; border-radius:0; box-shadow:none; line-height:0; font-size:0; box-sizing:border-box; }
  #map .study-pin svg { display:block; width:24px; height:24px; margin:0; padding:0; border:0; box-sizing:border-box; pointer-events:none; }
  #map .study-label { padding:4px 6px; line-height:18px; white-space:nowrap; }
  #map .leaflet-tooltip { color:#18251d; font-weight:600; }
  @media (max-width: 800px) { #map { height: 360px; } }
  .leaflet-control-attribution {
    background: rgba(255,255,255,.95) !important;
    color: #263238 !important;
    font-size: 11px !important;
    padding: 1px 5px !important;
  }
  .leaflet-control-attribution a { color: #075985 !important; }
  .sect { margin-top: 18px; }
  .sect h2 { font-size: 12px; text-transform: none; letter-spacing: .12em; color: var(--dim); margin-bottom: 8px; }
  #notes {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px;
    font: inherit; resize: vertical;
  }
  #notes:focus { outline: none; border-color: var(--accent); }
  .notesrow { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 6px; }
  #photoGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .ph { position: relative; }
  .ph img, .ph video { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .ph img { cursor: pointer; }
  .ph video { background: #000; cursor: pointer; }
  .ph .play {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 26px;
    text-shadow: 0 0 8px rgba(0,0,0,.8); pointer-events: none;
  }
  .ph button {
    position: absolute; top: 4px; right: 4px; background: rgba(16,20,24,.75);
    color: var(--hr); border: none; border-radius: 4px; cursor: pointer;
    font-size: 13px; padding: 2px 7px;
  }
  .photoAdd {
    display: inline-block; border: 1.5px dashed var(--line); border-radius: 6px;
    padding: 8px 14px; color: var(--dim); cursor: pointer; font-size: 13px;
  }
  .photoAdd:hover { border-color: var(--accent); color: var(--accent); }
  /* Detail A: scoped reference tokens; list and aggregate theme is unchanged. */
  #detail.da-phone { --bg:#f5f7f8; --text:#141b23; --dim:#78828d; --line:#e5eaf0; max-width:440px; margin:0 auto; padding:0; background:#fff; color:#141b23; border:0; border-radius:26px; overflow:hidden; box-shadow:0 22px 70px #1b334720; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; font-synthesis:none; }
  #detail .da-head {padding:25px 24px 19px;}
  #detail .da-tag {font-size:11px;font-weight:800;letter-spacing:.12em;color:#1aa78a;}
  #detail .da-header-row {display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:12px;}
  #detail #detailTitle {font-size:27px;letter-spacing:-.055em;margin:0;font-weight:780;color:#141b23;line-height:1.25;}
  #detail .da-date {font-size:12px;color:#78828d;margin-top:7px;}
  #detail .da-share {width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid #e5eaf0;background:white;color:#87919b;font-size:20px;cursor:not-allowed;}
  #detail .da-map-wrap {margin:0 16px 20px;border-radius:18px;overflow:hidden;background:#f1f3f3;position:relative;}
  #detail #map {height:310px;border:0;border-radius:0;margin:0;background:#f1f3f3;}

  #detail .da-main {padding:0 22px 28px;}
  #detail .da-section-label {display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 14px;font-size:17px;font-weight:760;letter-spacing:-.04em;}
  #detail .da-small-note {color:#87919b;font-size:10px;font-weight:500;}
  #detail .da-primary-grid {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding-bottom:22px;}
  #detail .da-metric {background:#f5f7f8;border-radius:15px;padding:17px 15px 16px;min-height:103px;overflow-wrap:anywhere;}
  #detail .da-key {font-size:12px;color:#78818b;margin-bottom:9px;display:flex;align-items:center;gap:7px;}
  #detail .da-key svg {width:20px;height:20px;flex:0 0 20px;}
  #detail .da-value {font-size:26px;line-height:1.2;font-weight:780;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
  #detail .da-unit {font-size:13px;color:#74808a;font-weight:600;}
  #detail .da-source {font-size:10px;color:#78828d;margin-top:7px;}
  #detail .da-unavailable {font-size:18px;}
  #detail .da-hr-banner {background:#fff5f5;padding:15px 17px;border-radius:14px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;}
  #detail .da-hr-banner small {display:block;font-size:11px;color:#9a6d72;margin-bottom:7px;}
  #detail .da-hr-banner strong {font-size:24px;color:#bf4753;letter-spacing:-.05em;}
  #detail .da-hr-banner i {font-size:12px;font-style:normal;color:#a7767c;}
  #detail .da-rule {height:1px;background:#e9edf0;margin:7px 0 24px;}
  #detail .da-chart-box {border-radius:15px;background:#fafbfd;padding:14px 10px 9px;margin-bottom:10px;}
  #detail .da-chart-box svg {display:block;width:100%;height:auto;min-height:157px;font-family:inherit;}
  #detail .da-legend {display:flex;justify-content:space-between;color:#78828d;font-size:10px;padding:2px 7px 6px;}
  #detail .da-graph-note {font-size:11px;color:#78828d;line-height:1.5;margin:4px 0 23px;}
  #detail .da-alt-band {display:flex;justify-content:space-between;padding:2px 0 12px;}
  #detail .da-alt-band span {font-size:11px;color:#87919b;display:block;margin-bottom:5px;}
  #detail .da-alt-band b {font-size:20px;letter-spacing:-.035em;}

  #activityTools {max-width:440px;margin:18px auto 0;font-size:12px;}
  #activityTools summary {cursor:pointer;color:#78828d;}
  #activityTools .da-management {display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;}
  #detail .da-empty {font-size:12px;color:#78828d;padding:24px 10px;}
  @media(max-width:800px){#detail #map {height:360px;}}
  @media(max-width:480px){#detail.da-phone {max-width:none;border-radius:0;box-shadow:none;}}
  #detail .da-date {display:flex;align-items:center;gap:8px;font-size:12px;line-height:18px;}
  #activityWeather {display:inline-flex;align-items:center;gap:4px;position:relative;font-size:inherit;line-height:inherit;cursor:help;flex-shrink:0;}
  #activityWeather[hidden] {display:none;}
  #activityWeather .weather-help {display:none;position:absolute;top:100%;right:0;z-index:1001;width:230px;padding:8px;background:white;border:1px solid #e5eaf0;border-radius:6px;color:#52606d;box-shadow:0 2px 8px #0002;}
  #activityWeather:hover .weather-help,#activityWeather:focus-within .weather-help {display:block;}
  #activityWeather .weather-help a {color:#075985;}
  /* List-only readability: never inherit these overrides into detail. */
  #activityListPanel { --dim:#a8b4c0; }
  #activityListPanel, #activityListPanel * {
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    letter-spacing:normal; line-height:1.4; font-variant-numeric:tabular-nums;
  }
  #activityListPanel .act .date { font-size:14px; font-weight:600; }
  #activityListPanel .act .sport { font-size:13px; margin-top:3px; }
  #activityListPanel .act > div:first-child { flex:1; min-width:0; }
  #activityListPanel .act .dist { flex:0 0 auto; align-self:center; }
  #activityListPanel .yhead { flex-wrap:wrap; }
  #activityListPanel .ysum { text-align:right; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <h1>Kilo<span>metrika</span></h1>

</header>

<div class="grid">
  <div>
    <div id="drop">.tcx / .gpx 파일을 놓거나 눌러서 선택하세요
      <input type="file" id="fileInput" accept=".tcx,.gpx" multiple hidden>
    </div>
    <div id="dropProg" class="uprog" hidden><span class="t"></span><div class="bar"><i></i></div></div>
    <div class="panel" id="activityListPanel">
      <h2>운동 기록</h2>
      <div id="list" style="font-size:13px"></div>
    </div>
  </div>

  <div>

    <div class="panel da-phone" id="detail" hidden>
      <div class="da-head">
        <div class="da-tag">ACTIVITY DETAIL</div>
        <div class="da-header-row"><div><h2 id="detailTitle"></h2><p class="da-date"><span id="detailDate"></span><span id="activityWeather" tabindex="0" hidden></span></p></div>
        <button id="shareDisabled" class="da-share" type="button" style="cursor:pointer" aria-label="이미지 저장" title="현재 운동 상세 카드 전체를 2배 해상도 PNG 이미지로 저장">↗</button></div>
      </div>
      <section class="da-map-wrap" aria-label="GPS 경로">
        <div id="map" hidden></div><p id="mapEmpty" class="da-empty" hidden>표시할 GPS 경로가 없습니다.</p>

      </section>
      <div class="da-main">
      <div class="da-section-label">활동 요약</div>
      <div class="da-primary-grid" id="stats"></div>
      <div class="da-rule"></div>
      <section aria-label="속도 변화">
        <div class="da-section-label">속도 변화</div>
        <div class="da-chart-box" id="speedGraph"></div>

        <p class="da-graph-note" id="speedNote"></p>
      </section>
      <div class="da-section-label">심박수 변화 <span style="color:#db5963;font-size:19px">♡</span></div>
      <div class="da-hr-banner"><div><small>평균 심박수</small><strong id="hrAverage">—</strong></div><div><small>최고 심박수</small><strong id="hrMaximum">—</strong></div></div>
      <div class="da-chart-box" id="hrGraph"></div>
      <p class="da-small-note" id="strengthDataStatus" hidden></p>
      <section id="hrZones" aria-label="심박수 구간 분포" hidden>
        <div class="da-section-label">심박수 구간 분포</div>
        <div class="da-metric"><p class="da-small-note">최대 심박수 설정 후 표시됩니다</p></div>
      </section>
      </div>
    </div>
      <details class="da-tools" id="activityTools" hidden><summary>운동 관리 · 기존 기능</summary>
        <div class="da-management"><div class="seg" id="catSeg" title="운동 유형 변경"><button data-c="run">달리기</button><button data-c="bike">자전거</button><button data-c="other">기타</button><button data-c="strength">근력운동</button></div><button class="del" id="delBtn">삭제</button></div>
      <div class="sect" id="splitsSect" hidden>
        <h2>킬로미터별 구간 · API 계산값</h2>
        <div id="splits" class="mono"></div>
      </div>
      <div class="sect">
        <h2>운동 메모</h2>
        <textarea id="notes" rows="3" placeholder="오늘 운동은 어땠나요?"></textarea>
        <div class="notesrow"><span id="notesStatus" class="muted"></span>
          <button class="del" id="notesSave">저장</button></div>
      </div>
      <div class="sect">
        <h2>사진과 동영상</h2>
        <div id="photoGrid"></div>
        <label class="photoAdd">+ 사진 또는 동영상 추가
          <input type="file" id="photoInput" accept="image/*,video/*" multiple hidden>
        </label>
        <div id="photoProg" class="uprog" hidden><span class="t"></span><div class="bar"><i></i></div></div>
      </div>
      </details>
    <div class="panel muted" id="placeholder">운동 기록을 선택하면 심박, 속도, 고도를 볼 수 있습니다. 시간은 Asia/Seoul 기준입니다.</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let selectedId = null, actChart = null;

// экранирование для innerHTML: sport приходит из загруженного файла
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmtDur = s => {
  if (s == null || !Number.isFinite(s) || s < 0) return "—";
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}시간 ${m}분` : `${m}분 ${Math.floor(s%60)}초`;
};

// Категория спорта по названию — Huawei/Garmin пишут кто во что горазд
// ("Бег на улице", "Running", "Biking", "Езда на велосипеде"...)
const CAT_COLORS = { run: "#7ee08a", bike: "#58a6ff", other: "#c9a15a", strength: "#c9a15a" };
// категорию считает сервер при импорте; эвристика — фолбэк для старых записей
const sportCat = a => a.category ||
  (/бег|run|jog/i.test(a.sport||"") ? "run" : /вел|bik|cycl|ride/i.test(a.sport||"") ? "bike" : "other");
const catColor = a => CAT_COLORS[sportCat(a)] || CAT_COLORS.other;
const asUTC = iso => /Z$|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z";
const seoulParts = iso => Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
  timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"
}).formatToParts(new Date(asUTC(iso))).map(p => [p.type, p.value]));
const fmtDate = iso => iso ? new Date(asUTC(iso)).toLocaleString("ko-KR",
  {timeZone:"Asia/Seoul", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}) : "—";
const sportLabel = a => ({run:"달리기", bike:"자전거", other:"기타", strength:"근력운동"}[sportCat(a)] || "기타");
// API exposes distance and duration, not a measured average speed. Display-only conversion.
const averageSpeed = a => Number.isFinite(a.distance_m) && a.distance_m >= 0 && Number.isFinite(a.duration_s) && a.duration_s > 0
  ? (a.distance_m / a.duration_s * 3.6).toFixed(2) : "—";
const pace = (dur, dist) => {
  if (!Number.isFinite(dist) || !Number.isFinite(dur) || dist <= 0 || dur <= 0) return "—";
  const spk = Math.round(dur / (dist/1000)), m = Math.floor(spk/60), s = spk%60;
  return `${m}:${String(s).padStart(2,"0")} min/km`;
};

// свёрнутость годов в списке; для годов без записи — развёрнут только текущий
const YEARS_KEY = "kmYearsOpen";
const yearsOpen = JSON.parse(localStorage.getItem(YEARS_KEY) || "{}");

function uniqueActivities(records) {
  const seen = new Set();
  return records.filter(a => {
    if (a.id == null) return true;
    const key = String(a.id);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function activityTotals(records) {
  let distance = null, calories = null;
  for (const a of uniqueActivities(records)) {
    if (["run", "bike"].includes(sportCat(a)) && Number.isFinite(a.distance_m) && a.distance_m >= 0)
      distance = (distance ?? 0) + a.distance_m;
    if (Number.isFinite(a.calories) && a.calories >= 0)
      calories = (calories ?? 0) + a.calories;

function speedStamp(p) {
  return typeof p.time === 'string' && p.time ? Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(p.time) ? p.time : p.time+'Z') : NaN;

function speedGPS(p) {

function speedDistance(a,b) {

    if(Number.isFinite(stamps[i]) && Number.isFinite(origin)) maxT=Math.max(maxT,(stamps[i]-origin)/1000);

    if(!forward || !speedGPS(a) || !speedGPS(b) || !Number.isFinite(dt) || dt<=0 || dt>15 || stamps[i-1]<origin) continue;

function trackSegments(tps) {
  const segments = []; let segment = [], previousTime = null;
  for (const t of tps) {
    const stamp = t.time ? Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(t.time) ? t.time : t.time+'Z') : NaN;
    if (previousTime !== null && Number.isFinite(stamp) && (stamp-previousTime>15000 || stamp<=previousTime)) {

    if (Number.isFinite(t.lat) && Number.isFinite(t.lon)) segment.push([t.lat, t.lon]);
    else if (segment.length) { segments.push(segment); segment = []; }
    previousTime=Number.isFinite(stamp)?stamp:null;
  }
  if (segment.length) segments.push(segment);
  return segments;
}

    if(segment.length===1) svg+=`<circle cx="${x(segment[0].x)}" cy="${y(segment[0].y)}" r="2" fill="${color}"/>`;
  }
  box.innerHTML=svg+'</svg>';
}
/* ACTIVITY_WEATHER_START */
const activityWeatherCache=new Map();
function weatherRequest(act,tps,now=Date.now()) {
  const p=tps.find(p=>Number.isFinite(p.lat)&&Math.abs(p.lat)<=90&&Number.isFinite(p.lon)&&Math.abs(p.lon)<=180);
  const s=act.start_time;
  const time=typeof s==='string'&&s?Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(s)?s:s+'Z'):NaN;
  if(!p||!Number.isFinite(time)||time>now) return null;
  const hour=Math.round(time/3600000)*3600, day=new Date(hour*1000).toISOString().slice(0,10);
  const recent=now-hour*1000<7*86400000;
  const base=recent?'https://api.open-meteo.com/v1/forecast':'https://archive-api.open-meteo.com/v1/archive';
  const params=new URLSearchParams({latitude:String(p.lat),longitude:String(p.lon),start_date:day,end_date:day,hourly:'temperature_2m,weather_code',temperature_unit:'celsius',timezone:'GMT',timeformat:'unixtime'});
  return {hour,url:base+'?'+params,key:[p.lat,p.lon,hour].join('|')};
}
function weatherSymbol(code) {
  const cloud='<path fill="#dbe7ee" stroke="#78909c" d="M5 17h13a4 4 0 0 0 0-8 6 6 0 0 0-11-1 4.5 4.5 0 0 0-2 9Z"/>';
  const sun='<circle cx="12" cy="12" r="4" fill="#facc15" stroke="#f59e0b"/><path stroke="#f59e0b" d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>';
  let label,shape;
  if(code===0){label='맑음';shape=sun;}
  else if([1,2,3].includes(code)){label=code===1?'대체로 맑음':code===2?'구름 조금':'흐림';shape=code===3?cloud:'<g transform="translate(-1 -2) scale(.6)">'+sun+'</g>'+cloud;}
  else if([45,48].includes(code)){label='안개';shape=cloud+'<path stroke="#94a3b8" d="M3 20h18M6 23h12"/>';}
  else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){label=[56,57,66,67].includes(code)?'어는 비':[51,53,55].includes(code)?'이슬비':'비';shape=cloud+'<path stroke="#3b82f6" d="m8 19-1 3m6-3-1 3m6-3-1 3"/>';}
  else if([71,73,75,77,85,86].includes(code)){label='눈';shape=cloud+'<path stroke="#38bdf8" d="M8 19v4m-2-2h4m6-2v4m-2-2h4"/>';}
  else if([95,96,99].includes(code)){label=code===95?'뇌우':'우박 동반 뇌우';shape=cloud+'<path stroke="#f59e0b" d="m13 15-4 5h4l-2 4"/>';}
  else return null;
  return {label,svg:`<svg width="18" height="18" style="display:block;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(2 2) scale(.833333)">${shape}</g></svg>`};
}
async function loadActivityWeather(act,tps,version,id) {
  const request=weatherRequest(act,tps); if(!request) return;
  try {
    let value=activityWeatherCache.get(request.key);
    if(value&&Date.now()-value.cachedAt>3600000){activityWeatherCache.delete(request.key);value=null;}
    if(!value){
      const response=await fetch(request.url,{signal:AbortSignal.timeout(8000),credentials:'omit',referrerPolicy:'no-referrer'});
      if(!response.ok) return;
      const data=await response.json(),h=data.hourly;
      const i=Array.isArray(h?.time)?h.time.indexOf(request.hour):-1;
      if(i<0||!Number.isFinite(h.temperature_2m?.[i])||!weatherSymbol(h.weather_code?.[i])) return;
      value={temperature:h.temperature_2m[i],code:h.weather_code[i],cachedAt:Date.now()};
      if(activityWeatherCache.size>=100) activityWeatherCache.delete(activityWeatherCache.keys().next().value);
      activityWeatherCache.set(request.key,value);
    }
    if(version!==activityRequestVersion||id!==selectedId) return;
    const symbol=weatherSymbol(value.code),el=document.getElementById('activityWeather');
    el.innerHTML=symbol.svg+`<span>${Math.round(value.temperature)}°C</span><span class="weather-help">${symbol.label} · 운동 시작 시각 기준·지역 추정<br><a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></span>`;
    el.setAttribute?.('aria-label',`${symbol.label}, ${Math.round(value.temperature)}°C, 운동 시작 시각 기준·지역 추정`);
    el.hidden=false;
  } catch (_) { /* Missing weather must never delay or break the activity view. */ }
}

  document.getElementById('stats').innerHTML=card('활동 시간',duration,'').replace('활동 시간','운동 시간')+

  const absent=Object.entries(act.data_status||{}).filter(([,v])=>v==='missing').map(([key])=>names[key]||key);

function heartZonesMarkup(result) {
  const heading='<div class="da-section-label">심박수 구간 분포</div>';
  const note=text=>heading+`<div class="da-metric"><p class="da-small-note">${esc(text)}</p></div>`;
  if(result.status!=='ok') {
    const reasons={original_missing_or_hash_mismatch:'원본 없음 또는 저장된 해시 불일치',activity_not_approved:'분석 승인 대상 아님',database_unavailable:'기록 조회 불가',activity_not_found:'기록 없음'};
    return note('분석 불가: '+(reasons[result.reason]||result.reason||'API 응답 오류'));
  }
  const total=result.valid_observed_seconds;
  if(!Number.isFinite(total)||total<=0) return note('분석 불가: 유효 심박 관측 시간 없음');
  const time=s=>{if(!Number.isFinite(s)||s<0)return '—';const v=Math.round(s);return `${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`;};
  const colors={Z5:'#db5963',Z4:'#e98535',Z3:'#43a66b',Z2:'#3988cc',Z1:'#939ba5'};
  let rows='';
  for(const zone of ['Z5','Z4','Z3','Z2','Z1']) {
    const s=result.zones_seconds?.[zone],range=result.criteria?.zones_bpm?.[zone];
    if(!Number.isFinite(s)||s<0||!Array.isArray(range))return note('분석 불가: 구간 데이터 누락');
    const percent=s/total*100,label=s===0?'0':percent.toFixed(1);
    rows+=`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:13px"><span><b>${zone}</b> <span style="opacity:.7">${esc(range[0])}–${esc(range[1])} bpm</span></span><span>${label}% · ${time(s)}</span></div><div style="height:7px;margin-top:6px;background:rgba(128,128,128,.14);border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.min(100,percent)}%;background:${colors[zone]};border-radius:4px"></div></div></div>`;
  }
  return heading+`<div class="da-metric">${rows}</div>`;
}

async function loadHeartZones(act,version) {
  const el=document.getElementById('hrZones');
  el.hidden=!isApprovedStrength(act);
  el.innerHTML='';
  if(el.hidden)return;
  el.innerHTML='<div class="da-section-label">심박수 구간 분포</div><p class="da-small-note">분석 중…</p>';
  try {
    const response=await fetch(`/api/activities/${act.id}/hr-zones`);
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const result=await response.json();
    if(version!==activityRequestVersion||act.id!==selectedId)return;
    if(result.status==='ok'&&(result.activity_id!==act.id||result.source_hash!==act.series_source_hash)) {
      el.innerHTML=heartZonesMarkup({status:'unavailable',reason:'기본 그래프와 원본 연결 불일치'});
      return;
    }
    el.innerHTML=heartZonesMarkup(result);
  } catch(error) {
    if(version!==activityRequestVersion||act.id!==selectedId)return;
    el.innerHTML=heartZonesMarkup({status:'unavailable',reason:'조회 실패 ('+error.message+')'});
  }
}

function renderHeartZonesAvailability(act) {
  void loadHeartZones(act,activityRequestVersion);
}

// Загрузка через XHR: даёт прогресс и ловит обрыв сети/таймаут,
// чего fetch здесь не показывал — крупные видео «молча» не грузились.
function uploadOne(url, file, onProgress) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      let detail = `HTTP ${xhr.status}`;
      try { detail = JSON.parse(xhr.responseText).detail || detail; } catch {}
      resolve({ ok: xhr.status >= 200 && xhr.status < 300, detail });
    };
    xhr.onerror = () => resolve({ ok: false, detail: "연결이 끊겼습니다" });
    xhr.ontimeout = () => resolve({ ok: false, detail: "응답 시간이 초과되었습니다" });
    const fd = new FormData(); fd.append("file", file);
    xhr.send(fd);
  });
}

async function uploadBatch(files, url, prog) {
  files = [...files];
  if (!files.length) return;
  const txt = prog.querySelector(".t"), bar = prog.querySelector(".bar > i");
  prog.hidden = false; prog.classList.remove("err");
  let ok = 0; const errors = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const mb = (f.size / 1048576).toFixed(1);
    const head = (files.length > 1 ? `(${i + 1}/${files.length}) ` : "") + `${f.name} · ${mb} MiB`;
    bar.style.width = "0%"; txt.textContent = `${head} — 0%`;
    const r = await uploadOne(url, f, p => {
      bar.style.width = Math.round(p * 100) + "%";
      txt.textContent = `${head} — ${Math.round(p * 100)}%`;
    });
    if (r.ok) ok++; else errors.push(`${f.name}: ${r.detail}`);
  }
  if (errors.length) {
    prog.classList.add("err");
    txt.textContent = `✗ ${errors.join("; ")}` + (ok ? ` · ${ok}개 추가됨` : "");
  } else {
    bar.style.width = "100%"; txt.textContent = `✓ ${ok}개 업로드 완료`;
    setTimeout(() => { if (!prog.classList.contains("err")) prog.hidden = true; }, 2500);
  }
}

const drop = $("#drop");
drop.onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => uploadFiles(e.target.files);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("hover"); };
drop.ondragleave = () => drop.classList.remove("hover");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("hover"); uploadFiles(e.dataTransfer.files); };

loadList();
</script>
