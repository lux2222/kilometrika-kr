services:
  kilometrika:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - kilometrika-data:/data
    environment:
      DATA_DIR: /data
      WATCH_INTERVAL: "${WATCH_INTERVAL:-30}"
      TZ: "${TZ:-UTC}"
      FRAME_LANG: "${FRAME_LANG:-en}"
      MQTT_HOST: "${MQTT_HOST:-}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USER: "${MQTT_USER:-}"
      MQTT_PASS: "${MQTT_PASS:-}"
      MQTT_PREFIX: "${MQTT_PREFIX:-kilometrika}"
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  kilometrika-data:
